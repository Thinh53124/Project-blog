<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/addnewartical.css">
    <title>Add New Article</title>
</head>

<body>
    <button class="close-btn" onclick="window.location.href='./admin_artical.html'">
        <i class="fa-regular fa-circle-xmark"></i>
    </button>

    <div class="form-wrapper">
        <h2>📝 Add New Article</h2>

        <label for="postTitle">Title:</label>
        <input type="text" id="postTitle" placeholder="Enter title...">

        <label for="postCategory">Article Categories:</label>
        <select id="postCategory">
            <option value="Daily Journal">Daily Journal</option>
            <option value="Work & Career">Work & Career</option>
            <option value="Personal Thoughts">Personal Thoughts</option>
            <option value="Emotions & Feelings">Emotions & Feelings</option>
        </select>

        <label for="postMood">Mood:</label>
        <select id="postMood">
            <option value="😃 Happy">😃 Happy</option>
            <option value="😢 Sad">😢 Sad</option>
            <option value="😠 Angry">😠 Angry</option>
            <option value="😴 Tired">😴 Tired</option>
            <option value="😎 Confident">😎 Confident</option>
        </select>

        <label for="postContent">Content:</label>
        <textarea id="postContent" placeholder="Write content..."></textarea>

        <div class="status-row">
            <span>Status</span>
            <label>
                <input type="radio" name="status" value="public" checked> public
            </label>
            <label>
                <input type="radio" name="status" value="private"> private
            </label>
        </div>

        <label>Article Image:</label>
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <img src="../image/Group.png" id="previewImg" alt="Preview" style="max-width: 100%; max-height: 80px; object-fit: cover;">
            <p id="uploadText">Browse and chose the files you want to upload from your computer</p>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>

        <button class="btn-add">Add</button>
    </div>
    <div id="editModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: white; padding: 30px; border-radius: 12px; width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
        <h3 style="margin-bottom: 20px;">📝 Chỉnh sửa bài viết</h3>
        <input type="hidden" id="editId">
        
        <div style="margin-bottom: 15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">Tiêu đề:</label>
            <input type="text" id="editTitle" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">Chủ đề:</label>
            <select id="editCategory" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;">
                <option value="Daily Journal">Daily Journal</option>
                <option value="Work & Career">Work & Career</option>
                <option value="Personal Thoughts">Personal Thoughts</option>
                <option value="Emotions & Feelings">Emotions & Feelings</option>
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">Nội dung:</label>
            <textarea id="editContent" style="width:100%; height:100px; padding:10px; border:1px solid #ddd; border-radius:6px;"></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
            <button onclick="closeEditModal()" style="padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; background: #eee;">Hủy</button>
            <button onclick="saveEdit()" style="padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; background: #6A5EAD; color: white;">Lưu thay đổi</button>
        </div>
    </div>
</div>
    <script src="../js/addnewartical.js"></script>
</body>

</html>
