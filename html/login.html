<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <img src="../image/login-img.png" alt="">
    <div class="button">
        <h3>Sign in with</h3>
        <button><i class="fa-brands fa-facebook-f" id="fb"></i></button>
        <button><i class="fa-brands fa-twitter"></i></button>
        <button><i class="fa-brands fa-linkedin-in"></i></button>
    </div>
    <form action="" class="form-login">
        <b>Or</b>
        <div class="email">
            <input type="email" placeholder=" Enter a valid email address">
            <p>Email address</p>
        </div>
        <div class="pass">
            <input type="text" placeholder=" Enter Password">
            <p>Password</p>
        </div>
    </form>
    <section>
        <button>Login</button>
        <span> 
            <p>Don't have an account?</p> <a href="./register.html">Register</a>
        </span>
    </section>
</body>
<footer>
    <p>Copyright © 2025. All rights reserved.</p>
    <div>
        <button><i class="fa-brands fa-facebook-f"></i></button>
        <button><i class="fa-brands fa-twitter"></i></button>
        <button><i class="fa-brands fa-google"></i></button>
        <button><i class="fa-brands fa-linkedin-in"></i></button>
    </div>
</footer>

</html>
