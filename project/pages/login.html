<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/login.css">
</head>
<body>

    <div class="img-login">
        <img src="../img/a6f14c1fa6846f29f11dc2e85f40b29fbcc92d57.png" alt="">
    </div>
        
    <div class="card">
        <form action="" class="login-form">
            <div class="sign-in-with">
                <p style="display: inline;">Sign in with</p>
                <div>
                    <button class="btn-link"><a href="https://www.facebook.com" ><i class="fa-brands fa-facebook-f"></i></a></button>
                    <button class="btn-link"><a href="http://x.com/home" ><i class="fa-brands fa-x-twitter"></i></a></button>
                    <button class="btn-link"><a href="https://www.linkedin.com/" ><i class="fa-brands fa-linkedin-in"></i></a></button>
                </div>
                
            </div>
            
            <br><br>

            <p style="font-weight: 700; line-height: 24px;">Or</p><br>
        
            <input type="email" placeholder="Enter a valid email address">
            <span>Email address</span><br><br>
                
            <input type="password" placeholder="Enter password">
            <span>Password</span><br><br><br><br>

            <button class="btn-submit">Login</button><br><br>
            <p class="register-link">Don't have an account? &nbsp; <a href="register.html">Register</a></p>
        </form>
    </div>
    <footer class="footer">
        <span>Copyright &copy; 2025. All rights reserved.</span>
        <a href="https://www.facebook.com"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="http://x.com/home"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="https://www.linkedin.com/"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="https://mail.google.com/"><i class="fa-brands fa-google"></i></a>
    </footer>
</body>
</html>
