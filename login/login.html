<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <img src="./draw2.webp.png" alt="ảnh minh họa login" class="img-login">
    <div class="login-account">
        <div class="link-sign-in">
            <p>Sign in with</p>
            <button class="btn-link"><i class="fa-brands fa-facebook-f"></i></button>
            <button class="btn-link"><i class="fa-brands fa-twitter"></i></button>
            <button class="btn-link"><i class="fa-brands fa-linkedin-in"></i></button>
        </div>
        <br>
        <b>Or</b>
        <form action="login.html" class="login-form">
            <input type="text" placeholder="Enter a valid email address">
            <span>Email address</span>
            <input type="password" placeholder="Enter password">
            <span>Password</span>
            <br><br><br><br>
            <button class="btn-login">Login</button>
            <br>
            <b>Don't have an account?<a href="../register/register.html" class="confirm-link">Register</a></b> 
        </form>
    </div>
    </div>
    <footer class="footer-link">
        <span class="footer-span">Copyright © 2025. All rights reserved.</span>
        <div class="footer-btn-link">
            <button class="btn-link"><i class="fa-brands fa-facebook-f"></i></button>
            <button class="btn-link"><i class="fa-brands fa-twitter"></i></button>
            <button class="btn-link"><i class="fa-brands fa-google"></i></button>
            <button class="btn-link"><i class="fa-brands fa-linkedin-in"></i></button>
        </div>
    </footer>
    <script src="login.js"></script>
</body>
</html>
