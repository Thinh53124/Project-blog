<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Manage Blog</title>
    <link rel="stylesheet" href="adminManageblog.css" />
  </head>

  <body>
    <!-- TOPBAR -->
    <header>
      <div class="topbar">
        <div></div>
        <div class="icons">
          <div class="icon-wrapper">
            <img src="./img/mail.png" />
            <span class="badge">2</span>
          </div>
          <img src="./img/bell.png" />
          <img src="./img/Ellipse 6.png" class="avatar" />
        </div>
      </div>
    </header>

    <hr />

    <div class="app">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <button class="menu active">
          <span class="icon-box"><img src="./img/user.png" /></span>
          Manage Users
        </button>

        <button class="menu">
          <span class="icon-box"><img src="./img/book.png" /></span>
          Manage Entries
        </button>

        <button class="menu">
          <span class="icon-box"><img src="./img/openbook.png" /></span>
          Manage Article
        </button>

        <button class="menu">
          <span class="icon-box"><img src="./img/logout.png" /></span>
          Log out
        </button>
      </div>

      <!-- MAIN -->
      <div class="main">
        <div class="post-header">
          <h2>Quản lý bài viết</h2>
          <button class="btn-add">Thêm mới bài viết</button>
        </div>

        <!-- TABLE -->
        <div class="post-table">
          <div class="post-head">
            <div>Ảnh</div>
            <div>Tiêu đề</div>
            <div>Chủ đề</div>
            <div>Nội dung</div>
            <div>Trạng thái</div>
            <div>Chỉnh sửa trạng thái</div>
            <div>Hành động</div>
          </div>

          <!-- ROW -->
          <div class="post-row">
            <img src="./img/Bài viết 1.png" class="thumb" />
            <div>Học nấu cà sốt cà chua</div>
            <div>Nấu ăn</div>
            <div>tôi đã học được cách nấu ăn...</div>
            <span class="status public"><b>Public</b></span>

            <div class="status-select">
              <select>
                <option>Public</option>
                <option>Private</option>
              </select>
            </div>

            <div class="actions">
              <button class="edit">Sửa</button>
              <button class="delete">Xóa</button>
            </div>
          </div>

          <div class="post-row">
            <img src="./img/Bài viết 2.png" class="thumb" />
            <div>Bí kíp viết CV ngành IT</div>
            <div>IT</div>
            <div>Chia sẻ cách viết CV ấn tượng...</div>
            <span class="status private"><b>Private</b></span>

            <div class="status-select">
              <select>
                <option>Private</option>
                <option>Public</option>
              </select>
            </div>

            <div class="actions">
              <button class="edit">Sửa</button>
              <button class="delete">Xóa</button>
            </div>
          </div>
        </div>

        <!-- PAGINATION -->
        <div class="pagination">
          <button class="page-btn">
            <img src="./img/arrow 1.png" />
            Previous
          </button>

          <div class="pages">
            <span class="active">1</span>
            <span>2</span>
            <span>3</span>
            <span>...</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>
          </div>

          <button class="page-btn">
            Next
            <img src="./img/arrow 2.png" />
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
