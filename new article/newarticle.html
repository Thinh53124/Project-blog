<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Article</title>
    <link rel="stylesheet" href="newarticle.css">
</head>
<body>

    <div class="container">

        <form class="form">

            <h1>📝 Add New Article</h1>

            <!-- Title -->
            <label>Title:</label>
            <input type="text" class="title-input" placeholder="Enter your title...">

            <label>Article Categories:</label>
            <input type="text" placeholder="Enter category">

            <label>Mood:</label>
            <select>
                <option>😊 Happy</option>
                <option>😢 Sad</option>
                <option>😎 Cool</option>
            </select>

            <label>Content:</label>
            <textarea rows="8" placeholder="Write your article..."></textarea>

            <input type="file">

            <button type="submit">Publish</button>

        </form>

    </div>


</body>
</html>
